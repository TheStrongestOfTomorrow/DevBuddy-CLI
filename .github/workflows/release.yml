name: Release DevBuddy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump when package.json was not changed
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine release mode
        id: mode
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TAG="v$CURRENT"

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi

          if grep -q "^## \[$CURRENT\]" CHANGELOG.md 2>/dev/null; then
            CHANGELOG_HAS_VERSION=true
          else
            CHANGELOG_HAS_VERSION=false
          fi

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            PREVIOUS=$(git show HEAD^:package.json 2>/dev/null | node -e '
              let s = "";
              process.stdin.on("data", d => s += d);
              process.stdin.on("end", () => console.log(JSON.parse(s).version));
            ' 2>/dev/null || echo "$CURRENT")
          else
            PREVIOUS="$CURRENT"
          fi

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            VERSION_CHANGED=true
          else
            VERSION_CHANGED=false
          fi

          # If a release version is already declared in CHANGELOG but has no
          # tag yet, publish that exact version. This bootstraps v1.1.4.
          if [ "$TAG_EXISTS" = false ] && [ "$CHANGELOG_HAS_VERSION" = true ]; then
            RELEASE_EXISTING=true
          else
            RELEASE_EXISTING=false
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "release_existing=$RELEASE_EXISTING" >> "$GITHUB_OUTPUT"

      - name: Bump version automatically
        if: steps.mode.outputs.version_changed != 'true' && steps.mode.outputs.release_existing != 'true'
        run: |
          BUMP="${{ inputs.bump || 'patch' }}"
          npm version "$BUMP" --no-git-tag-version

      - name: Read release version
        id: release
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Update changelog for automated bump
        if: steps.mode.outputs.version_changed != 'true' && steps.mode.outputs.release_existing != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = fs.readFileSync('CHANGELOG.md', 'utf8');
          const version = process.env.VERSION;
          const date = new Date().toISOString().slice(0, 10);
          const entry = `## [${version}] — ${date}\n\n### Changed\n\n- Automated release generated by GitHub Actions.\n\n---\n\n`;
          const marker = '# Changelog\n\n';
          if (!file.includes(`## [${version}]`)) {
            fs.writeFileSync('CHANGELOG.md', file.replace(marker, marker + entry));
          }
          NODE

      - name: Commit and tag automated release
        if: steps.mode.outputs.version_changed != 'true' && steps.mode.outputs.release_existing != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "DevBuddy v$VERSION"
          git push origin main --follow-tags

      - name: Tag manually versioned release
        if: steps.mode.outputs.version_changed == 'true' || steps.mode.outputs.release_existing == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
          else
            git tag -a "v$VERSION" -m "DevBuddy v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test package
        run: npm test

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
